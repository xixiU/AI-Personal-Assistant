<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据查看 - AI 助手管理系统</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- 侧边栏 -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">
                <a href="/static/index.html" class="admin-logo">
                    <div class="admin-logo-icon">⚖</div>
                    <div class="admin-logo-text">AI 助手</div>
                </a>
            </div>

            <nav class="admin-nav">
                <a href="/static/index.html" class="nav-item">
                    <span class="nav-icon">💬</span>
                    <span>返回聊天</span>
                </a>
                <a href="/static/user-profile.html" class="nav-item">
                    <span class="nav-icon">👤</span>
                    <span>用户中心</span>
                </a>
                <a href="/static/admin-users.html" class="nav-item">
                    <span class="nav-icon">👥</span>
                    <span>用户管理</span>
                </a>
                <a href="/static/admin-data.html" class="nav-item active">
                    <span class="nav-icon">📊</span>
                    <span>数据查看</span>
                </a>
            </nav>

            <div class="admin-sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">👨‍💼</div>
                    <div>
                        <div style="color: white; font-weight: 500;" id="userNickname">管理员</div>
                        <div style="font-size: 12px;" id="userRole">管理员</div>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn">退出登录</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="admin-main">
            <header class="admin-header">
                <h1 class="admin-header-title">数据查看</h1>
            </header>

            <div class="admin-content">
                <!-- 统计卡片 -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-header">
                            <div class="stat-title">总用户数</div>
                            <div class="stat-icon primary">👥</div>
                        </div>
                        <div class="stat-value" id="statTotalUsers">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">
                            <div class="stat-title">活跃用户</div>
                            <div class="stat-icon success">✅</div>
                        </div>
                        <div class="stat-value" id="statActiveUsers">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">
                            <div class="stat-title">总对话次数</div>
                            <div class="stat-icon primary">💬</div>
                        </div>
                        <div class="stat-value" id="statTotalChats">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">
                            <div class="stat-title">今日对话</div>
                            <div class="stat-icon success">📈</div>
                        </div>
                        <div class="stat-value" id="statTodayChats">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">
                            <div class="stat-title">总反馈数</div>
                            <div class="stat-icon warning">👍</div>
                        </div>
                        <div class="stat-value" id="statTotalFeedbacks">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">
                            <div class="stat-title">今日活跃用户</div>
                            <div class="stat-icon success">👤</div>
                        </div>
                        <div class="stat-value" id="statTodayUsers">-</div>
                    </div>
                </div>

                <!-- 选项卡 -->
                <div class="card">
                    <div style="border-bottom: 1px solid var(--border); margin-bottom: 20px;">
                        <div style="display: flex; gap: 24px;">
                            <button class="tab-btn active" data-tab="chat-history">问答历史</button>
                            <button class="tab-btn" data-tab="feedback-stats">反馈统计</button>
                        </div>
                    </div>

                    <!-- 问答历史 -->
                    <div id="chat-history-tab" class="tab-content active">
                        <div class="toolbar">
                            <div class="search-box">
                                <input
                                    type="text"
                                    class="search-input"
                                    id="chatSearchInput"
                                    placeholder="搜索用户..."
                                >
                                <button class="btn btn-secondary btn-sm" id="chatSearchBtn">搜索</button>
                            </div>
                            <button class="btn btn-secondary btn-sm" id="exportChatBtn">导出数据</button>
                        </div>

                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>用户</th>
                                        <th>问题</th>
                                        <th>回答</th>
                                        <th>反馈</th>
                                        <th>时间</th>
                                    </tr>
                                </thead>
                                <tbody id="chatTableBody">
                                    <tr>
                                        <td colspan="6" style="text-align: center; padding: 40px;">
                                            加载中...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="pagination" id="chatPagination"></div>
                    </div>

                    <!-- 反馈统计 -->
                    <div id="feedback-stats-tab" class="tab-content" style="display: none;">
                        <div style="margin-bottom: 24px;">
                            <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                                <div class="stat-card">
                                    <div class="stat-header">
                                        <div class="stat-title">总反馈数</div>
                                        <div class="stat-icon primary">📝</div>
                                    </div>
                                    <div class="stat-value" id="feedbackTotal">-</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-header">
                                        <div class="stat-title">赞同数</div>
                                        <div class="stat-icon success">👍</div>
                                    </div>
                                    <div class="stat-value" id="feedbackLike">-</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-header">
                                        <div class="stat-title">不准确数</div>
                                        <div class="stat-icon warning">👎</div>
                                    </div>
                                    <div class="stat-value" id="feedbackDislike">-</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-header">
                                        <div class="stat-title">满意度</div>
                                        <div class="stat-icon success">📊</div>
                                    </div>
                                    <div class="stat-value" id="feedbackRate" style="font-size: 28px;">-</div>
                                </div>
                            </div>
                        </div>

                        <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 16px;">最近的负面反馈</h3>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>用户</th>
                                        <th>反馈类型</th>
                                        <th>反馈内容</th>
                                        <th>相关问题</th>
                                        <th>时间</th>
                                    </tr>
                                </thead>
                                <tbody id="feedbackTableBody">
                                    <tr>
                                        <td colspan="6" style="text-align: center; padding: 40px;">
                                            加载中...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <style>
        .tab-btn {
            padding: 12px 16px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: var(--primary);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>

    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script>
        // 权限检查
        if (!requireAdmin()) {
            // 非管理员会自动跳转
        }

        const user = Auth.getUser();
        if (user) {
            document.getElementById('userNickname').textContent = user.nickname || user.username;
        }

        // 登出
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('确定要退出登录吗？')) {
                Auth.logout();
            }
        });

        // 选项卡切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabName = btn.dataset.tab;

                // 切换按钮状态
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // 切换内容区
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(tabName + '-tab').classList.add('active');

                // 加载对应数据
                if (tabName === 'feedback-stats') {
                    loadFeedbackStats();
                }
            });
        });

        // 加载统计数据
        async function loadStats() {
            try {
                const result = await AdminAPI.getStats();

                if (result.success) {
                    const data = result.data;
                    document.getElementById('statTotalUsers').textContent = data.total_users;
                    document.getElementById('statActiveUsers').textContent = data.active_users;
                    document.getElementById('statTotalChats').textContent = data.total_chats;
                    document.getElementById('statTodayChats').textContent = data.today_chats;
                    document.getElementById('statTotalFeedbacks').textContent = data.total_feedbacks;
                    document.getElementById('statTodayUsers').textContent = data.today_users;
                } else {
                    showToast(result.message, 'error');
                }
            } catch (error) {
                showToast('加载统计数据失败：' + error.message, 'error');
            }
        }

        // 问答历史分页状态
        let chatPage = 1;
        const chatPageSize = 20;
        let chatSearchKeyword = '';

        // 加载问答历史
        async function loadChatHistory() {
            try {
                const filters = chatSearchKeyword ? { username: chatSearchKeyword } : {};
                const result = await AdminAPI.getChatHistory(chatPage, chatPageSize, filters);

                if (result.success) {
                    renderChatTable(result.data.records);
                    renderChatPagination(result.data.total);
                } else {
                    showToast(result.message, 'error');
                }
            } catch (error) {
                showToast('加载问答历史失败：' + error.message, 'error');
            }
        }

        // 渲染问答表格
        function renderChatTable(records) {
            const tbody = document.getElementById('chatTableBody');

            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px;">暂无数据</td></tr>';
                return;
            }

            tbody.innerHTML = records.map(r => `
                <tr>
                    <td>${r.id}</td>
                    <td>${r.username}</td>
                    <td style="max-width: 200px;" title="${r.question}">${truncateText(r.question, 40)}</td>
                    <td style="max-width: 250px;" title="${r.answer}">${truncateText(r.answer, 50)}</td>
                    <td>
                        ${r.feedback_type === 'like' ? '<span class="badge badge-success">👍 赞同</span>' : ''}
                        ${r.feedback_type === 'dislike' ? '<span class="badge badge-warning">👎 不准确</span>' : ''}
                        ${!r.feedback_type ? '<span class="badge badge-info">无反馈</span>' : ''}
                    </td>
                    <td>${formatDateTime(r.created_at)}</td>
                </tr>
            `).join('');
        }

        // 渲染问答分页
        function renderChatPagination(total) {
            const totalPages = Math.ceil(total / chatPageSize);
            const pagination = document.getElementById('chatPagination');

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = `
                <button class="page-btn" ${chatPage === 1 ? 'disabled' : ''} onclick="goToChatPage(${chatPage - 1})">
                    上一页
                </button>
            `;

            let startPage = Math.max(1, chatPage - 3);
            let endPage = Math.min(totalPages, chatPage + 3);

            for (let i = startPage; i <= endPage; i++) {
                html += `
                    <button class="page-btn ${i === chatPage ? 'active' : ''}" onclick="goToChatPage(${i})">
                        ${i}
                    </button>
                `;
            }

            html += `
                <button class="page-btn" ${chatPage === totalPages ? 'disabled' : ''} onclick="goToChatPage(${chatPage + 1})">
                    下一页
                </button>
            `;

            pagination.innerHTML = html;
        }

        // 问答历史翻页
        window.goToChatPage = function(page) {
            chatPage = page;
            loadChatHistory();
        };

        // 问答历史搜索
        document.getElementById('chatSearchBtn').addEventListener('click', () => {
            chatSearchKeyword = document.getElementById('chatSearchInput').value.trim();
            chatPage = 1;
            loadChatHistory();
        });

        document.getElementById('chatSearchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('chatSearchBtn').click();
            }
        });

        // 导出问答历史
        document.getElementById('exportChatBtn').addEventListener('click', async () => {
            const filters = chatSearchKeyword ? { username: chatSearchKeyword } : {};
            try {
                const result = await AdminAPI.exportData('chat_history', filters);
                if (result.success) {
                    showToast(result.message, 'success');
                } else {
                    showToast(result.message, 'error');
                }
            } catch (error) {
                showToast('导出失败：' + error.message, 'error');
            }
        });

        // 加载反馈统计
        async function loadFeedbackStats() {
            try {
                const result = await AdminAPI.getFeedbackStats();

                if (result.success) {
                    const data = result.data;
                    document.getElementById('feedbackTotal').textContent = data.total;
                    document.getElementById('feedbackLike').textContent = data.like;
                    document.getElementById('feedbackDislike').textContent = data.dislike;
                    document.getElementById('feedbackRate').textContent = (data.like_rate * 100).toFixed(1) + '%';

                    renderFeedbackTable(data.recent_feedbacks);
                } else {
                    showToast(result.message, 'error');
                }
            } catch (error) {
                showToast('加载反馈统计失败：' + error.message, 'error');
            }
        }

        // 渲染反馈表格
        function renderFeedbackTable(feedbacks) {
            const tbody = document.getElementById('feedbackTableBody');

            if (feedbacks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px;">暂无负面反馈</td></tr>';
                return;
            }

            tbody.innerHTML = feedbacks.map(f => `
                <tr>
                    <td>${f.id}</td>
                    <td>${f.username}</td>
                    <td>
                        <span class="badge badge-warning">👎 不准确</span>
                    </td>
                    <td style="max-width: 200px;" title="${f.feedback_text || '-'}">${truncateText(f.feedback_text || '-', 40)}</td>
                    <td style="max-width: 250px;" title="${f.question}">${truncateText(f.question, 50)}</td>
                    <td>${formatDateTime(f.created_at)}</td>
                </tr>
            `).join('');
        }

        // 初始加载
        loadStats();
        loadChatHistory();
    </script>
</body>
</html>
