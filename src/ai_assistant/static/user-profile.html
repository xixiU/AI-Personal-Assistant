<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心 - 智慧法庭 AI 助手</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-scope="user">
    <div class="layout">
        <aside class="side">
            <div class="side-brand"><div class="brand-mark">⚖</div>智慧法庭 AI 助手</div>
            <nav class="side-nav">
                <a href="/" id="navChat">💬 对话</a>
                <a href="/profile" id="navProfile" class="active">👤 用户中心</a>
            </nav>
            <div class="side-user">
                <div>
                    <div class="name" id="sideName">-</div>
                    <div class="role" id="sideRole">-</div>
                </div>
                <button class="btn btn-sm" id="logoutBtn">退出登录</button>
            </div>
        </aside>

        <main class="content">
            <div class="page-head">
                <div>
                    <h1>用户中心</h1>
                    <p>查看账号信息、修改登录密码</p>
                </div>
            </div>

            <div class="grid-2">
                <section class="card">
                    <div class="card-head"><h2>账号信息</h2></div>
                    <div class="card-body">
                        <div class="field"><label>用户名</label><input class="input" id="pUsername" readonly></div>
                        <div class="field"><label>显示名称</label><input class="input" id="pName" readonly></div>
                        <div class="field"><label>角色</label><input class="input" id="pRole" readonly></div>
                        <div class="field" id="createdField" hidden><label>注册时间</label><input class="input" id="pCreated" readonly></div>
                    </div>
                </section>

                <section class="card">
                    <div class="card-head"><h2>修改密码</h2></div>
                    <div class="card-body">
                        <div class="form-error" id="pwdError" hidden></div>
                        <form id="pwdForm" novalidate>
                            <div class="field">
                                <label for="oldPwd">当前密码</label>
                                <input class="input" id="oldPwd" type="password" autocomplete="current-password">
                            </div>
                            <div class="field">
                                <label for="newPwd">新密码</label>
                                <input class="input" id="newPwd" type="password" autocomplete="new-password">
                                <div class="hint">至少 6 位，不能与当前密码相同</div>
                            </div>
                            <div class="field">
                                <label for="newPwd2">确认新密码</label>
                                <input class="input" id="newPwd2" type="password" autocomplete="new-password">
                            </div>
                            <button class="btn btn-primary btn-block" id="pwdBtn" type="submit">保存新密码</button>
                        </form>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
    (async function () {
        // 登录态以 GET /api/auth/me 为准（HttpOnly cookie），未登录时 guard 已跳用户登录页
        var user = await App.guard();
        if (!user) return;

        var ROLE_TEXT = { admin: '管理员', user: '普通用户' };

        document.getElementById('navChat').href = App.url.userChat();
        document.getElementById('navProfile').href = App.url.userProfile();
        document.getElementById('logoutBtn').addEventListener('click', App.logout);

        function render(u) {
            var name = u.display_name || u.name || u.username || '';
            document.getElementById('sideName').textContent = name;
            document.getElementById('sideRole').textContent = ROLE_TEXT[u.role] || u.role || '';
            document.getElementById('pUsername').value = u.username || '';
            document.getElementById('pName').value = name;
            document.getElementById('pRole').value = ROLE_TEXT[u.role] || u.role || '';
            if (u.created_at) {
                document.getElementById('pCreated').value = u.created_at;
                document.getElementById('createdField').hidden = false;
            }
        }

        // guard 已经拿到 /api/auth/me 的结果，直接渲染
        render(user);

        var form = document.getElementById('pwdForm');
        var errEl = document.getElementById('pwdError');
        var btn = document.getElementById('pwdBtn');
        function showErr(msg) { errEl.textContent = msg; errEl.hidden = !msg; }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var oldPwd = document.getElementById('oldPwd').value;
            var newPwd = document.getElementById('newPwd').value;
            var newPwd2 = document.getElementById('newPwd2').value;

            if (!oldPwd || !newPwd) return showErr('请填写当前密码和新密码');
            if (newPwd.length < 6) return showErr('新密码长度不能少于 6 位');
            if (newPwd === oldPwd) return showErr('新密码不能与当前密码相同');
            if (newPwd !== newPwd2) return showErr('两次输入的新密码不一致');

            showErr('');
            btn.disabled = true;
            try {
                // 旧密码错误时后端返回 401 AUTH_FAILED，这里不能当成登录过期处理
                await App.post('/api/auth/change-password',
                    { old_password: oldPwd, new_password: newPwd },
                    { noRedirect: true });
                App.toast('密码修改成功，请重新登录', 'success');
                // 改密成功后走 logout 清掉服务端 cookie，再回用户登录页
                setTimeout(function () { App.logout(); }, 1200);
            } catch (err) {
                if (err.status === 401 && err.code !== 'AUTH_FAILED') { App.toLogin(); return; }
                showErr(err.message || '密码修改失败');
                btn.disabled = false;
            }
        });
    })();
    </script>
</body>
</html>
