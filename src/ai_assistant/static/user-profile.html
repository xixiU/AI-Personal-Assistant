<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心 - 智慧法庭 AI 助手</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-scope="user">
    <div class="layout">
        <aside class="side">
            <div class="side-brand"><div class="brand-mark">⚖</div>智慧法庭 AI 助手</div>
            <nav class="side-nav">
                <a href="/" id="navChat">💬 对话</a>
                <a href="/profile" id="navProfile" class="active">👤 用户中心</a>
            </nav>
            <div class="side-user">
                <div>
                    <div class="name" id="sideName">-</div>
                    <div class="role" id="sideRole">-</div>
                </div>
                <button class="btn btn-sm" id="logoutBtn">退出登录</button>
            </div>
        </aside>

        <main class="content">
            <div class="page-head">
                <div>
                    <h1>用户中心</h1>
                    <p>查看账号信息、修改登录密码、浏览历史记录</p>
                </div>
            </div>

            <!-- 历史记录区域 -->
            <section class="card" style="margin-bottom: 20px;">
                <div class="card-head">
                    <h2>历史记录</h2>
                </div>
                <div class="card-body" style="padding: 0;">
                    <div class="tabs" style="margin: 20px 20px 0; border-radius: 10px;">
                        <button id="tabChat" class="active">我的对话</button>
                        <button id="tabFeedback">我的反馈</button>
                        <button id="tabWordCloud">词云</button>
                    </div>

                    <!-- 我的对话 Tab -->
                    <div id="chatHistoryPane" class="history-pane">
                        <div class="toolbar" style="padding: 16px 20px; border-bottom: 1px solid var(--border);">
                            <input class="input" id="chatSearchInput" type="text" placeholder="搜索对话内容..." style="width: 280px;">
                            <button class="btn btn-ghost btn-sm" id="chatSearchBtn">搜索</button>
                            <button class="btn btn-ghost btn-sm" id="chatResetBtn">重置</button>
                        </div>
                        <div id="chatHistoryList"></div>
                        <div class="pager" id="chatPager" hidden>
                            <div id="chatPageInfo">-</div>
                            <div class="btns">
                                <button class="btn btn-ghost btn-sm" id="chatPrevBtn">上一页</button>
                                <button class="btn btn-ghost btn-sm" id="chatNextBtn">下一页</button>
                            </div>
                        </div>
                    </div>

                    <!-- 我的反馈 Tab -->
                    <div id="feedbackHistoryPane" class="history-pane" hidden>
                        <div class="toolbar" style="padding: 16px 20px; border-bottom: 1px solid var(--border);">
                            <div class="tabs" style="display: inline-flex; padding: 2px; background: var(--surface-2); border-radius: 8px;">
                                <button class="filter-tab active" data-type="">全部</button>
                                <button class="filter-tab" data-type="like">点赞</button>
                                <button class="filter-tab" data-type="dislike">点踩</button>
                            </div>
                        </div>
                        <div id="feedbackHistoryList"></div>
                        <div class="pager" id="feedbackPager" hidden>
                            <div id="feedbackPageInfo">-</div>
                            <div class="btns">
                                <button class="btn btn-ghost btn-sm" id="feedbackPrevBtn">上一页</button>
                                <button class="btn btn-ghost btn-sm" id="feedbackNextBtn">下一页</button>
                            </div>
                        </div>
                    </div>

                    <!-- 词云 Tab -->
                    <div id="wordCloudPane" class="history-pane" hidden>
                        <div id="userWordCloud" style="width: 100%; height: 500px;"></div>
                    </div>
                </div>
            </section>

            <div class="grid-2">
                <section class="card">
                    <div class="card-head"><h2>账号信息</h2></div>
                    <div class="card-body">
                        <div class="field"><label>用户名</label><input class="input" id="pUsername" readonly></div>
                        <div class="field"><label>显示名称</label><input class="input" id="pName" readonly></div>
                        <div class="field"><label>角色</label><input class="input" id="pRole" readonly></div>
                        <div class="field" id="createdField" hidden><label>注册时间</label><input class="input" id="pCreated" readonly></div>
                    </div>
                </section>

                <section class="card">
                    <div class="card-head"><h2>修改密码</h2></div>
                    <div class="card-body">
                        <div class="form-error" id="pwdError" hidden></div>
                        <form id="pwdForm" novalidate>
                            <div class="field">
                                <label for="oldPwd">当前密码</label>
                                <input class="input" id="oldPwd" type="password" autocomplete="current-password">
                            </div>
                            <div class="field">
                                <label for="newPwd">新密码</label>
                                <input class="input" id="newPwd" type="password" autocomplete="new-password">
                                <div class="hint">至少 6 位，不能与当前密码相同</div>
                            </div>
                            <div class="field">
                                <label for="newPwd2">确认新密码</label>
                                <input class="input" id="newPwd2" type="password" autocomplete="new-password">
                            </div>
                            <button class="btn btn-primary btn-block" id="pwdBtn" type="submit">保存新密码</button>
                        </form>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/echarts.min.js"></script>
    <script src="/static/js/echarts-wordcloud.min.js"></script>
    <style>
        .history-pane { min-height: 400px; }
        .history-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        .history-item:hover { background: var(--surface-2); }
        .history-item:last-child { border-bottom: none; }
        .history-time { font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
        .history-q {
            font-size: 14px;
            color: var(--text);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .history-a {
            font-size: 13px;
            color: var(--text-2);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .history-a.expanded {
            display: block;
            -webkit-line-clamp: unset;
        }
        .history-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }
        .feedback-type {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .feedback-text {
            font-size: 13px;
            color: var(--text-2);
            margin-top: 6px;
            padding: 10px 12px;
            background: var(--surface-2);
            border-radius: 8px;
        }
        .filter-tab {
            border: none;
            background: none;
            padding: 4px 12px;
            border-radius: 6px;
            font: inherit;
            font-size: 13px;
            color: var(--text-2);
            cursor: pointer;
        }
        .filter-tab.active {
            background: var(--surface);
            color: var(--text);
            box-shadow: var(--shadow);
        }
    </style>
    <script>
    (async function () {
        // 登录态以 GET /api/auth/me 为准（HttpOnly cookie），未登录时 guard 已跳用户登录页
        var user = await App.guard();
        if (!user) return;

        var ROLE_TEXT = { admin: '管理员', user: '普通用户' };

        document.getElementById('navChat').href = App.url.userChat();
        document.getElementById('navProfile').href = App.url.userProfile();
        document.getElementById('logoutBtn').addEventListener('click', App.logout);

        function render(u) {
            var name = u.display_name || u.name || u.username || '';
            document.getElementById('sideName').textContent = name;
            document.getElementById('sideRole').textContent = ROLE_TEXT[u.role] || u.role || '';
            document.getElementById('pUsername').value = u.username || '';
            document.getElementById('pName').value = name;
            document.getElementById('pRole').value = ROLE_TEXT[u.role] || u.role || '';
            if (u.created_at) {
                document.getElementById('pCreated').value = u.created_at;
                document.getElementById('createdField').hidden = false;
            }
        }

        // guard 已经拿到 /api/auth/me 的结果，直接渲染
        render(user);

        // ===== 密码修改 =====
        var form = document.getElementById('pwdForm');
        var errEl = document.getElementById('pwdError');
        var btn = document.getElementById('pwdBtn');
        function showErr(msg) { errEl.textContent = msg; errEl.hidden = !msg; }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var oldPwd = document.getElementById('oldPwd').value;
            var newPwd = document.getElementById('newPwd').value;
            var newPwd2 = document.getElementById('newPwd2').value;

            if (!oldPwd || !newPwd) return showErr('请填写当前密码和新密码');
            if (newPwd.length < 6) return showErr('新密码长度不能少于 6 位');
            if (newPwd === oldPwd) return showErr('新密码不能与当前密码相同');
            if (newPwd !== newPwd2) return showErr('两次输入的新密码不一致');

            showErr('');
            btn.disabled = true;
            try {
                // 旧密码错误时后端返回 401 AUTH_FAILED，这里不能当成登录过期处理
                await App.post('/api/auth/change-password',
                    { old_password: oldPwd, new_password: newPwd },
                    { noRedirect: true });
                App.toast('密码修改成功，请重新登录', 'success');
                // 改密成功后走 logout 清掉服务端 cookie，再回用户登录页
                setTimeout(function () { App.logout(); }, 1200);
            } catch (err) {
                if (err.status === 401 && err.code !== 'AUTH_FAILED') { App.toLogin(); return; }
                showErr(err.message || '密码修改失败');
                btn.disabled = false;
            }
        });

        // ===== 历史记录 Tab 切换 =====
        var tabChat = document.getElementById('tabChat');
        var tabFeedback = document.getElementById('tabFeedback');
        var tabWordCloud = document.getElementById('tabWordCloud');
        var chatPane = document.getElementById('chatHistoryPane');
        var feedbackPane = document.getElementById('feedbackHistoryPane');
        var wordCloudPane = document.getElementById('wordCloudPane');

        tabChat.addEventListener('click', function () {
            tabChat.classList.add('active');
            tabFeedback.classList.remove('active');
            tabWordCloud.classList.remove('active');
            chatPane.hidden = false;
            feedbackPane.hidden = true;
            wordCloudPane.hidden = true;
        });

        tabFeedback.addEventListener('click', function () {
            tabFeedback.classList.add('active');
            tabChat.classList.remove('active');
            tabWordCloud.classList.remove('active');
            feedbackPane.hidden = false;
            chatPane.hidden = true;
            wordCloudPane.hidden = true;
            if (!feedbackState.loaded) loadFeedbackHistory();
        });

        tabWordCloud.addEventListener('click', function () {
            tabWordCloud.classList.add('active');
            tabChat.classList.remove('active');
            tabFeedback.classList.remove('active');
            wordCloudPane.hidden = false;
            chatPane.hidden = true;
            feedbackPane.hidden = true;
            if (!wordCloudState.loaded) loadUserWordCloud();
        });

        // ===== 我的对话 =====
        var chatState = {
            page: 1,
            pageSize: 20,
            keyword: '',
            total: 0,
            loading: false
        };

        var chatList = document.getElementById('chatHistoryList');
        var chatPager = document.getElementById('chatPager');
        var chatPageInfo = document.getElementById('chatPageInfo');
        var chatPrevBtn = document.getElementById('chatPrevBtn');
        var chatNextBtn = document.getElementById('chatNextBtn');
        var chatSearchInput = document.getElementById('chatSearchInput');
        var chatSearchBtn = document.getElementById('chatSearchBtn');
        var chatResetBtn = document.getElementById('chatResetBtn');

        async function loadChatHistory() {
            if (chatState.loading) return;
            chatState.loading = true;

            try {
                var params = { page: chatState.page, page_size: chatState.pageSize };
                if (chatState.keyword) params.keyword = chatState.keyword;

                var resp = await App.get('/api/user/chat-history' + App.qs(params));
                chatState.total = resp.data.total || 0;
                renderChatHistory(resp.data.records || []);
                updateChatPager();
            } catch (err) {
                App.toast(err.message || '加载对话历史失败', 'error');
                chatList.innerHTML = '<div class="empty">加载失败：' + App.escape(err.message) + '</div>';
            } finally {
                chatState.loading = false;
            }
        }

        function renderChatHistory(items) {
            if (items.length === 0) {
                chatList.innerHTML = '<div class="empty">暂无对话记录</div>';
                return;
            }

            var html = '';
            items.forEach(function (item) {
                var time = formatTime(item.timestamp || item.created_at);
                var question = App.escape(item.query || '');
                var answer = App.escape(item.answer || '');
                var answerId = 'answer-' + item.record_id;
                var answerPreview = answer.length > 100 ? answer.slice(0, 100) + '...' : answer;

                html += '<div class="history-item">';
                html += '<div class="history-time">' + time + '</div>';
                html += '<div class="history-q">Q: ' + question + '</div>';
                html += '<div class="history-a" id="' + answerId + '">' + answerPreview + '</div>';
                html += '<div class="history-actions">';
                if (answer.length > 100) {
                    html += '<button class="btn btn-link btn-sm toggle-answer" data-id="' + answerId + '" data-full="' + App.escape(answer) + '" data-preview="' + App.escape(answerPreview) + '">查看完整</button>';
                }
                html += '<button class="btn btn-link btn-sm feedback-like" data-record-id="' + item.record_id + '" data-session-id="' + App.escape(item.session_id || '') + '">👍 赞同</button>';
                html += '<button class="btn btn-link btn-sm feedback-dislike" data-record-id="' + item.record_id + '" data-session-id="' + App.escape(item.session_id || '') + '">👎 不准确</button>';
                html += '</div>';
                html += '</div>';
            });

            chatList.innerHTML = html;
        }

        function updateChatPager() {
            var totalPages = Math.ceil(chatState.total / chatState.pageSize);
            if (totalPages <= 1) {
                chatPager.hidden = true;
                return;
            }

            chatPager.hidden = false;
            chatPageInfo.textContent = '第 ' + chatState.page + ' / ' + totalPages + ' 页，共 ' + chatState.total + ' 条';
            chatPrevBtn.disabled = chatState.page <= 1;
            chatNextBtn.disabled = chatState.page >= totalPages;
        }

        chatPrevBtn.addEventListener('click', function () {
            if (chatState.page > 1) {
                chatState.page--;
                loadChatHistory();
            }
        });

        chatNextBtn.addEventListener('click', function () {
            var totalPages = Math.ceil(chatState.total / chatState.pageSize);
            if (chatState.page < totalPages) {
                chatState.page++;
                loadChatHistory();
            }
        });

        chatSearchBtn.addEventListener('click', function () {
            chatState.keyword = chatSearchInput.value.trim();
            chatState.page = 1;
            loadChatHistory();
        });

        chatResetBtn.addEventListener('click', function () {
            chatSearchInput.value = '';
            chatState.keyword = '';
            chatState.page = 1;
            loadChatHistory();
        });

        chatSearchInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                chatSearchBtn.click();
            }
        });

        // 查看完整答案 / 反馈
        chatList.addEventListener('click', function (e) {
            if (e.target.classList.contains('toggle-answer')) {
                var answerId = e.target.dataset.id;
                var answerEl = document.getElementById(answerId);
                var isExpanded = answerEl.classList.contains('expanded');

                if (isExpanded) {
                    answerEl.textContent = e.target.dataset.preview;
                    answerEl.classList.remove('expanded');
                    e.target.textContent = '查看完整';
                } else {
                    answerEl.textContent = e.target.dataset.full;
                    answerEl.classList.add('expanded');
                    e.target.textContent = '收起';
                }
            } else if (e.target.classList.contains('feedback-like')) {
                submitChatFeedback(e.target.dataset.recordId, e.target.dataset.sessionId, 'like', '');
            } else if (e.target.classList.contains('feedback-dislike')) {
                var recordId = e.target.dataset.recordId;
                var sessionId = e.target.dataset.sessionId;
                var feedbackText = prompt('请描述哪里不准确（可选）：');
                if (feedbackText !== null) {
                    submitChatFeedback(recordId, sessionId, 'dislike', feedbackText);
                }
            }
        });

        async function submitChatFeedback(recordId, sessionId, type, text) {
            try {
                await App.post('/api/feedback', {
                    session_id: sessionId,
                    record_id: recordId,
                    feedback_type: type,
                    feedback_text: text
                });
                App.toast('感谢您的反馈！', 'success');
            } catch (err) {
                App.toast(err.message || '反馈提交失败', 'error');
            }
        }

        // ===== 我的反馈 =====
        var feedbackState = {
            page: 1,
            pageSize: 20,
            feedbackType: '',
            total: 0,
            loading: false,
            loaded: false
        };

        var feedbackList = document.getElementById('feedbackHistoryList');
        var feedbackPager = document.getElementById('feedbackPager');
        var feedbackPageInfo = document.getElementById('feedbackPageInfo');
        var feedbackPrevBtn = document.getElementById('feedbackPrevBtn');
        var feedbackNextBtn = document.getElementById('feedbackNextBtn');

        // 筛选按钮
        document.querySelectorAll('.filter-tab').forEach(function (tab) {
            tab.addEventListener('click', function () {
                document.querySelectorAll('.filter-tab').forEach(function (t) { t.classList.remove('active'); });
                tab.classList.add('active');
                feedbackState.feedbackType = tab.dataset.type;
                feedbackState.page = 1;
                loadFeedbackHistory();
            });
        });

        async function loadFeedbackHistory() {
            if (feedbackState.loading) return;
            feedbackState.loading = true;
            feedbackState.loaded = true;

            try {
                var params = { page: feedbackState.page, page_size: feedbackState.pageSize };
                if (feedbackState.feedbackType) params.feedback_type = feedbackState.feedbackType;

                var resp = await App.get('/api/user/feedback' + App.qs(params));
                feedbackState.total = resp.data.total || 0;
                renderFeedbackHistory(resp.data.records || []);
                updateFeedbackPager();
            } catch (err) {
                App.toast(err.message || '加载反馈历史失败', 'error');
                feedbackList.innerHTML = '<div class="empty">加载失败：' + App.escape(err.message) + '</div>';
            } finally {
                feedbackState.loading = false;
            }
        }

        function renderFeedbackHistory(items) {
            if (items.length === 0) {
                feedbackList.innerHTML = '<div class="empty">暂无反馈记录</div>';
                return;
            }

            var html = '';
            items.forEach(function (item) {
                var time = formatTime(item.timestamp || item.created_at);
                var typeIcon = item.feedback_type === 'like' ? '👍 点赞' : '👎 点踩';
                var question = App.escape(item.query || '无相关问题');
                var feedbackText = item.feedback_text ? App.escape(item.feedback_text) : '';

                html += '<div class="history-item">';
                html += '<div class="history-time">' + time + '</div>';
                html += '<div class="feedback-type"><strong>' + typeIcon + '</strong></div>';
                html += '<div class="history-q">Q: ' + question + '</div>';
                if (feedbackText) {
                    html += '<div class="feedback-text">反馈内容: ' + feedbackText + '</div>';
                }
                html += '</div>';
            });

            feedbackList.innerHTML = html;
        }

        function updateFeedbackPager() {
            var totalPages = Math.ceil(feedbackState.total / feedbackState.pageSize);
            if (totalPages <= 1) {
                feedbackPager.hidden = true;
                return;
            }

            feedbackPager.hidden = false;
            feedbackPageInfo.textContent = '第 ' + feedbackState.page + ' / ' + totalPages + ' 页，共 ' + feedbackState.total + ' 条';
            feedbackPrevBtn.disabled = feedbackState.page <= 1;
            feedbackNextBtn.disabled = feedbackState.page >= totalPages;
        }

        feedbackPrevBtn.addEventListener('click', function () {
            if (feedbackState.page > 1) {
                feedbackState.page--;
                loadFeedbackHistory();
            }
        });

        feedbackNextBtn.addEventListener('click', function () {
            var totalPages = Math.ceil(feedbackState.total / feedbackState.pageSize);
            if (feedbackState.page < totalPages) {
                feedbackState.page++;
                loadFeedbackHistory();
            }
        });

        // ===== 词云 =====
        var wordCloudState = {
            loaded: false
        };

        async function loadUserWordCloud() {
            if (wordCloudState.loaded) return;
            wordCloudState.loaded = true;

            var container = document.getElementById('userWordCloud');
            container.innerHTML = '<div class="empty">加载中…</div>';

            try {
                var resp = await App.get('/api/data/wordcloud');
                var data = resp.data || [];

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="empty">暂无数据</div>';
                    return;
                }

                var chart = echarts.init(container);
                var option = {
                    series: [{
                        type: 'wordCloud',
                        shape: 'circle',
                        sizeRange: [12, 60],
                        rotationRange: [-90, 90],
                        rotationStep: 45,
                        gridSize: 8,
                        drawOutOfBound: false,
                        textStyle: {
                            fontFamily: 'sans-serif',
                            fontWeight: 'bold',
                            color: function () {
                                var colors = ['#5470c6', '#91cc75', '#fac858', '#ee6666', '#73c0de'];
                                return colors[Math.floor(Math.random() * colors.length)];
                            }
                        },
                        data: data.map(function (item) {
                            return {
                                name: item.word,
                                value: item.count
                            };
                        })
                    }]
                };

                chart.setOption(option);
            } catch (err) {
                container.innerHTML = '<div class="empty">加载失败：' + App.escape(err.message) + '</div>';
            }
        }

        // ===== 工具函数 =====
        function formatTime(timeStr) {
            if (!timeStr) return '-';
            try {
                var d = new Date(timeStr);
                var now = new Date();
                var diff = now - d;
                var dayDiff = Math.floor(diff / 86400000);

                if (dayDiff === 0) {
                    var hours = d.getHours().toString().padStart(2, '0');
                    var minutes = d.getMinutes().toString().padStart(2, '0');
                    return '今天 ' + hours + ':' + minutes;
                } else if (dayDiff === 1) {
                    return '昨天';
                } else if (dayDiff < 7) {
                    return dayDiff + ' 天前';
                } else {
                    var year = d.getFullYear();
                    var month = (d.getMonth() + 1).toString().padStart(2, '0');
                    var day = d.getDate().toString().padStart(2, '0');
                    if (year === now.getFullYear()) {
                        return month + '-' + day;
                    }
                    return year + '-' + month + '-' + day;
                }
            } catch (e) {
                return timeStr;
            }
        }

        // 初始化加载对话历史
        loadChatHistory();
    })();
    </script>
</body>
</html>
