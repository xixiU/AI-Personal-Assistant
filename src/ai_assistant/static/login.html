<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI 助手管理系统</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logo">⚖</div>
                <h1 class="login-title">AI 助手管理系统</h1>
                <p class="login-subtitle">请登录以继续使用</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">用户名</label>
                    <input
                        type="text"
                        id="username"
                        class="form-input"
                        placeholder="请输入用户名"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">密码</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="请输入密码"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    登录
                </button>
            </form>

            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0; font-size: 13px; color: #64748b; text-align: center;">
                <p>测试账号（开发阶段）：</p>
                <p>管理员：admin / admin123</p>
                <p>普通用户：user / user123</p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');

        // 如果已登录，跳转到用户中心
        if (Auth.isLoggedIn()) {
            if (Auth.isAdmin()) {
                window.location.href = '/static/admin-users.html';
            } else {
                window.location.href = '/static/user-profile.html';
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // 客户端验证
            if (!username) {
                showToast('请输入用户名', 'error');
                return;
            }

            if (!password) {
                showToast('请输入密码', 'error');
                return;
            }

            if (password.length < 6) {
                showToast('密码长度不能少于6位', 'error');
                return;
            }

            // 禁用表单
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            try {
                const result = await Auth.login(username, password);

                if (result.success) {
                    // 保存 Token 和用户信息
                    Auth.setToken(result.data.token);
                    Auth.setUser(result.data.user);

                    showToast('登录成功', 'success');

                    // 根据角色跳转
                    setTimeout(() => {
                        if (result.data.user.role === 'admin') {
                            window.location.href = '/static/admin-users.html';
                        } else {
                            window.location.href = '/static/user-profile.html';
                        }
                    }, 500);
                } else {
                    showToast(result.message, 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登录';
                }
            } catch (error) {
                showToast('登录失败：' + error.message, 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        });

        // 回车登录
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        // 聚焦用户名输入框
        usernameInput.focus();
    </script>
</body>
</html>
