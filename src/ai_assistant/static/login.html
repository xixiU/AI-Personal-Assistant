<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智慧法庭 AI 助手</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-scope="user">
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-mark">⚖</div>
                <h1>智慧法庭 AI 助手</h1>
                <p>请使用账号登录后开始对话</p>
            </div>

            <div class="form-error" id="formError" hidden></div>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="username">用户名</label>
                    <input class="input" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary btn-block" id="submitBtn" type="submit">登录</button>
            </form>

            <div class="auth-foot">忘记密码请联系管理员重置</div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
    (function () {
        // 已登录（以 /api/auth/me 为准）直接进聊天页
        App.fetchMe().then(function (me) {
            if (me) location.replace(App.nextUrl(App.url.userChat()));
        }).catch(function () { /* 查询失败时停留在登录页 */ });

        var form = document.getElementById('loginForm');
        var errEl = document.getElementById('formError');
        var btn = document.getElementById('submitBtn');

        function showErr(msg) { errEl.textContent = msg; errEl.hidden = !msg; }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var username = form.username.value.trim();
            var password = form.password.value;
            if (!username || !password) { showErr('请输入用户名和密码'); return; }

            showErr('');
            btn.disabled = true;
            btn.textContent = '登录中…';
            try {
                // POST /api/auth/login：成功后服务端下发 HttpOnly 会话 cookie，前端不保存 token
                await App.post('/api/auth/login', { username: username, password: password }, { noRedirect: true });
                location.replace(App.nextUrl(App.url.userChat()));
            } catch (err) {
                showErr(err.message || '登录失败');
                btn.disabled = false;
                btn.textContent = '登录';
            }
        });
    })();
    </script>
</body>
</html>
