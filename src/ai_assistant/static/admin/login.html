<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台登录 - 智慧法庭 AI 助手</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-scope="admin">
    <div class="auth-page admin">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-mark">⚙</div>
                <h1>管理后台</h1>
                <p>仅限管理员账号登录</p>
            </div>

            <div class="form-error" id="formError" hidden></div>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="username">管理员账号</label>
                    <input class="input" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary btn-block" id="submitBtn" type="submit">登录</button>
            </form>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
    (function () {
        // 已是管理员登录态（以 /api/auth/me 为准）直接进后台
        App.fetchMe().then(function (me) {
            if (me && me.role === 'admin') location.replace(App.nextUrl(App.url.adminHome()));
        }).catch(function () { /* 停留在登录页 */ });

        var form = document.getElementById('loginForm');
        var errEl = document.getElementById('formError');
        var btn = document.getElementById('submitBtn');

        function showErr(msg) { errEl.textContent = msg; errEl.hidden = !msg; }
        function reset() { btn.disabled = false; btn.textContent = '登录'; }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var username = form.username.value.trim();
            var password = form.password.value;
            if (!username || !password) { showErr('请输入账号和密码'); return; }

            showErr('');
            btn.disabled = true;
            btn.textContent = '登录中…';
            try {
                // 对照表 v1 #1：scope=admin，非管理员返回 403 NOT_ADMIN 且不下发 cookie
                var res = await App.post('/api/auth/login',
                    { username: username, password: password, scope: 'admin' }, { noRedirect: true });
                var user = res.data && res.data.user;
                if (!user || user.role !== 'admin') {
                    // 兜底：后端未按 scope 拦截时，立即注销刚建立的会话
                    try { await App.post('/api/auth/logout', {}, { noRedirect: true }); } catch (e2) { /* ignore */ }
                    showErr('该账号不是管理员');
                    reset();
                    return;
                }
                location.replace(App.nextUrl(App.url.adminHome()));
            } catch (err) {
                showErr(err.code === 'NOT_ADMIN' ? '该账号不是管理员' : (err.message || '登录失败'));
                reset();
            }
        });
    })();
    </script>
</body>
</html>
